<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kora Gestión Humana</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Backdrop del Drawer -->
  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <!-- Menú Hamburguesa Lateral -->
  <aside id="sideDrawer" class="side-drawer">
    <div class="drawer-header">
      <h2 style="font-size: 1.15rem; font-weight: 800; color: #fff;">Ecosistema Kora</h2>
      <button class="btn-icon" data-action="close-drawer">✕</button>
    </div>
    
    <div class="drawer-section-title">SUITE DE NEGOCIO</div>
    <nav class="drawer-list">
      <button class="drawer-item" data-action="notice-inventario">📦 Gestión de Inventario</button>
      <button class="drawer-item" data-action="notice-fabricacion">⚙️ Fabricación & Órdenes</button>
      <button class="drawer-item" data-action="notice-ventas">🏷️️ Ventas & Mostrador</button>
      <button class="drawer-item" data-action="notice-costos">💡 Costos & Servicios</button>
      <button class="drawer-item active" data-action="nav-home">👥 Gestión Humana (RRHH)</button>
      <button class="drawer-item" data-action="notice-financiero">📊 Financiero & Cuentas</button>
    </nav>
  </aside>

  <!-- Encabezado Principal -->
  <header>
    <div class="header-left">
      <button class="btn-icon" data-action="open-drawer">☰</button>
      <h1 id="headerTitle" style="font-size: 1.1rem; font-weight: 800;">Kora RRHH</h1>
    </div>
    <div class="offline-badge">100% Offline</div>
  </header>

  <!-- Contenedor Principal donde se montan las Vistas -->
  <main id="appContent"></main>

  <!-- OBLIGATORIO: type="module" para permitir import/export -->
  <script type="module" src="js/app.js" version="1.0.0"></script>
</body>
</html>
