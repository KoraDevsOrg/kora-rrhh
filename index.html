<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kora Gestión Humana</title>
  <style>
    :root {
      --bg-color: #0a0f1d;
      --surface: #141e33;
      --surface-accent: #1e2c4a;
      --surface-hover: #26385c;
      --border: #243556;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-gold: #f59e0b;
      --accent-gold-grad: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      --accent-blue-grad: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      --accent-purple-grad: linear-gradient(135deg, #818cf8 0%, #4f46e5 100%);
      --accent-orange-grad: linear-gradient(135deg, #fb923c 0%, #ea580c 100%);
      --accent-green-grad: linear-gradient(135deg, #34d399 0%, #059669 100%);
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
      --red-alert: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 20px;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left { display: flex; align-items: center; gap: 14px; }
    .btn-icon { background: transparent; border: none; color: var(--text-main); font-size: 1.4rem; cursor: pointer; }
    .offline-badge { font-size: 0.65rem; text-transform: uppercase; padding: 4px 10px; background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 9999px; font-weight: 700; }

    main { flex: 1; padding: 20px 16px; max-width: 760px; margin: 0 auto; width: 100%; }

    .hub-grid { display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }
    .hub-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 18px;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .hub-card::after { content: "➔"; position: absolute; right: 20px; font-size: 1.2rem; color: var(--text-sub); }
    .hub-card:active { transform: scale(0.98); background: var(--surface-hover); }

    .hub-icon-badge {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
    }

    .icon-blue { background: var(--accent-blue-grad); }
    .icon-purple { background: var(--accent-purple-grad); }
    .icon-orange { background: var(--accent-orange-grad); }
    .icon-green { background: var(--accent-green-grad); }
    .icon-gold { background: var(--accent-gold-grad); }

    .hub-info { flex: 1; padding-right: 24px; }
    .hub-title { font-size: 1.05rem; font-weight: 800; color: #ffffff; margin-bottom: 4px; }
    .hub-desc { font-size: 0.8rem; color: var(--text-sub); line-height: 1.35; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
    .card-header-bar { display: flex; justify-content: space-between; align-items: center; }
    .card-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); }

    .btn-primary {
      background: var(--accent-gold-grad);
      color: #0b1120;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
    }
    .btn-secondary { background: var(--surface-accent); color: var(--text-main); border: 1px solid var(--border); padding: 12px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; }
    .btn-sm { font-size: 0.8rem; padding: 6px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; border: none; }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-sub); }
    .input-field { background: var(--surface-accent); border: 1px solid var(--border); color: var(--text-main); padding: 12px 14px; border-radius: 10px; font-size: 0.95rem; outline: none; width: 100%; }
    .input-field:focus { border-color: var(--accent-blue); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; margin-top: 16px; }

    .calc-highlight-box {
      background: #080d1a;
      border-radius: 12px;
      padding: 12px 16px;
      margin: 10px 0;
      border: 1px solid var(--border);
    }

    .habeas-data-box {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.78rem;
      color: #bae6fd;
      line-height: 1.4;
      margin-top: 14px;
    }

    .table-container { width: 100%; overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-accent); margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    th { background: #0c1424; color: var(--text-sub); text-transform: uppercase; font-size: 0.7rem; font-weight: 700; }

    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; }
    .badge-active { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-progress { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.3); }

    .drawer-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 40; }
    .drawer-backdrop.active { opacity: 1; pointer-events: auto; }
    .side-drawer { position: fixed; top: 0; left: 0; bottom: 0; width: 290px; background: var(--surface); border-right: 1px solid var(--border); transform: translateX(-100%); transition: transform 0.2s ease; z-index: 50; display: flex; flex-direction: column; }
    .side-drawer.open { transform: translateX(0); }
    .drawer-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .drawer-section-title { font-size: 0.7rem; color: var(--text-sub); font-weight: bold; padding: 16px 20px 6px 20px; letter-spacing: 0.6px; }
    .drawer-list { flex: 1; overflow-y: auto; }
    .drawer-item { width: 100%; text-align: left; background: transparent; border: none; color: var(--text-main); padding: 14px 20px; font-size: 0.9rem; cursor: pointer; border-left: 4px solid transparent; display: flex; align-items: center; gap: 12px; }
    .drawer-item.active { background: var(--surface-accent); border-left-color: var(--accent-gold); font-weight: bold; }
  </style>
</head>
<body>

  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <aside id="sideDrawer" class="side-drawer">
    <div class="drawer-header">
      <h2 style="font-size: 1.15rem; font-weight: 800; color: #fff;">Ecosistema Kora</h2>
      <button class="btn-icon" data-action="close-drawer">✕</button>
    </div>
    
    <div class="drawer-section-title">SUITE DE NEGOCIO</div>
    <nav class="drawer-list">
      <button class="drawer-item" data-action="notice-inventario">📦 Gestión de Inventario</button>
      <button class="drawer-item" data-action="notice-fabricacion">⚙️ Fabricación & Órdenes</button>
      <button class="drawer-item" data-action="notice-ventas">🏷️ Ventas & Mostrador</button>
      <button class="drawer-item" data-action="notice-costos">💡 Costos & Servicios</button>
      <button class="drawer-item active" data-action="nav-home">👥 Gestión Humana (RRHH)</button>
      <button class="drawer-item" data-action="notice-financiero">📊 Financiero & Cuentas</button>
    </nav>
  </aside>

  <header>
    <div class="header-left">
      <button class="btn-icon" data-action="open-drawer">☰</button>
      <h1 id="headerTitle" style="font-size: 1.1rem; font-weight: 800;">Kora RRHH</h1>
    </div>
    <div class="offline-badge">100% Offline</div>
  </header>

  <main id="appContent"></main>

  <script src="js/app.js"></script>
</body>
</html>
